name: adhera
description: "Medication management and review-only adherence verification."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  dio: ^5.11.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  google_mlkit_text_recognition: ^0.15.0
  camera: ^0.12.0+2
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/adhera_logo.png
    - assets/pills/
