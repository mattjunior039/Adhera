# A generic, single database configuration.

[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname

prepend_sys_path = .

version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatter_default]
class = logging.Formatter
format = %(levelname)-5.5s [%(name)s] %(message)s

[formatter_generic]
class = logging.Formatter
format = %(levelname)-5.5s [%(name)s] %(message)s

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[logger_root]
level = WARN
handlers = console
